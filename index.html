<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Tableau de bord — Direction</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    iframe{border:0;width:100%;height:100%;display:block}
    #chargement{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f6faf8;font:16px Arial,sans-serif;color:#16302a;z-index:2}
    #chargement[hidden]{display:none}
    #chargement i{width:34px;height:34px;border:4px solid #b9ded6;border-top-color:#07856f;border-radius:50%;animation:t .8s linear infinite}
    @keyframes t{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="chargement" role="status" aria-live="polite"><i aria-hidden="true"></i><span>Chargement du tableau de bord…</span></div>
  <iframe id="app" title="Tableau de bord — Direction" allow="clipboard-write"></iframe>
  <noscript><p><a href="https://script.google.com/a/macros/lycee-les-eucalyptus.org/s/AKfycbwQoKZOD2LeDyGqBRIVl6_uAPe6z3iGEW-w60ybCMu2Z3Rf4HAy-8ap_9FwFcKuHo7-qA/exec?page=tableau-de-bord">Ouvrir le tableau de bord</a></p></noscript>
  <script>
  (function(){
    'use strict';
    /* Enveloppe sans bandeau Google Apps Script : seules les pages de la direction sont servies. */
    var gas='https://script.google.com/a/macros/lycee-les-eucalyptus.org/s/AKfycbwQoKZOD2LeDyGqBRIVl6_uAPe6z3iGEW-w60ybCMu2Z3Rf4HAy-8ap_9FwFcKuHo7-qA/exec';
    var pages={'tableau-de-bord':true,'statistiques-direction':true};
    var garder={'dir':true,'jeton':true,'annee':true};
    var q=new URL(location.href).searchParams,t=new URL(gas),page=q.get('page')||'';
    t.searchParams.set('page',pages[page]?page:'tableau-de-bord');
    q.forEach(function(v,k){if(garder[k])t.searchParams.set(k,v);});
    var frame=document.getElementById('app'),attente=document.getElementById('chargement');
    frame.addEventListener('load',function(){attente.hidden=true;});
    frame.src=t.toString();
  })();
  </script>
</body>
</html>
